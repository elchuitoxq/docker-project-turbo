x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  init: true
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: development
    DATABASE_HOST: postgres
    DATABASE_URL: postgres://myuser:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/mydb
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    SEED_ENV: development

services:
  postgres:
    image: postgres:18.4-alpine3.23
    container_name: mono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: mydb
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydb']
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de un solo uso: migraciones + seed. Antes se ejecutaba en cada
  # arranque del backend, lo que hacía el startup lento y no determinista.
  db-setup:
    <<: *app
    container_name: mono-db-setup
    restart: 'no'
    environment:
      <<: *app-env
      WAIT_FOR_POSTGRES: 'true'
      BUILD_DATABASE: 'true'
      RUN_DATABASE_SETUP: 'true'
    volumes:
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/drizzle:/app/packages/database/drizzle
      - ./packages/database/drizzle.config.ts:/app/packages/database/drizzle.config.ts
      - ./packages/database/package.json:/app/packages/database/package.json
      - ./packages/database/tsconfig.json:/app/packages/database/tsconfig.json
      - ./packages/database/tsconfig.build.json:/app/packages/database/tsconfig.build.json
    command:
      [
        './scripts/dev-entrypoint.sh',
        'sh',
        '-c',
        'echo "[db-setup] migraciones y seed completados"',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    container_name: mono-backend
    ports:
      - '4000:4000'
    environment:
      <<: *app-env
      PORT: '4000'
      BUILD_DATABASE: 'true'
    volumes:
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/test:/app/apps/backend/test
      - ./apps/backend/scripts:/app/apps/backend/scripts
      - ./apps/backend/docs:/app/apps/backend/docs
      - ./apps/backend/nest-cli.json:/app/apps/backend/nest-cli.json
      - ./apps/backend/tsconfig.json:/app/apps/backend/tsconfig.json
      - ./apps/backend/tsconfig.build.json:/app/apps/backend/tsconfig.build.json
      - ./apps/backend/eslint.config.mjs:/app/apps/backend/eslint.config.mjs
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/drizzle:/app/packages/database/drizzle
      - ./packages/database/drizzle.config.ts:/app/packages/database/drizzle.config.ts
      - ./packages/database/package.json:/app/packages/database/package.json
      - ./packages/database/tsconfig.json:/app/packages/database/tsconfig.json
      - ./packages/database/tsconfig.build.json:/app/packages/database/tsconfig.build.json
    command: ['./scripts/dev-entrypoint.sh', 'pnpm', '--filter', 'backend', 'dev:tools']
    # `docker compose watch` (pnpm dev:docker:watch):
    # - el código del backend se sincroniza y Nest lo recompila solo
    # - un cambio en el schema reinicia el contenedor, que recompila `packages/database`
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /app/apps/backend/src
        - action: restart
          path: ./packages/database/src
        - action: restart
          path: ./packages/database/drizzle
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  frontend:
    <<: *app
    container_name: mono-frontend
    ports:
      - '3000:3000'
    environment:
      <<: *app-env
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      HOSTNAME: 0.0.0.0
    volumes:
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./apps/frontend/app:/app/apps/frontend/app
      - ./apps/frontend/components:/app/apps/frontend/components
      - ./apps/frontend/modules:/app/apps/frontend/modules
      - ./apps/frontend/hooks:/app/apps/frontend/hooks
      - ./apps/frontend/lib:/app/apps/frontend/lib
      - ./apps/frontend/stores:/app/apps/frontend/stores
      - ./apps/frontend/styles:/app/apps/frontend/styles
      - ./apps/frontend/types:/app/apps/frontend/types
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/next-env.d.ts:/app/apps/frontend/next-env.d.ts
      - ./apps/frontend/next.config.ts:/app/apps/frontend/next.config.ts
      - ./apps/frontend/postcss.config.mjs:/app/apps/frontend/postcss.config.mjs
      - ./apps/frontend/tsconfig.json:/app/apps/frontend/tsconfig.json
      - ./apps/frontend/vitest.config.ts:/app/apps/frontend/vitest.config.ts
      - ./apps/frontend/components.json:/app/apps/frontend/components.json
      - ./apps/frontend/package.json:/app/apps/frontend/package.json
    command: ['pnpm', '--filter', 'frontend', 'dev']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

  mock:
    <<: *app
    container_name: mono-mock
    profiles: ['tools']
    ports:
      - '127.0.0.1:4010:4010'
    command: ['pnpm', '--filter', 'backend', 'mock']
    volumes:
      - ./apps/backend/docs:/app/apps/backend/docs:ro
    depends_on:
      backend:
        condition: service_healthy

  drizzle-studio:
    <<: *app
    container_name: mono-drizzle
    profiles: ['tools']
    ports:
      - '127.0.0.1:4983:4983'
    volumes:
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/drizzle:/app/packages/database/drizzle
      - ./packages/database/drizzle.config.ts:/app/packages/database/drizzle.config.ts
      - ./packages/database/package.json:/app/packages/database/package.json
      - ./packages/database/tsconfig.json:/app/packages/database/tsconfig.json
    command: ['pnpm', '--filter', 'database', 'db:studio:docker']
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.10
    container_name: mono-pgadmin
    profiles: ['tools']
    restart: unless-stopped
    ports:
      - '127.0.0.1:5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
